name: iOS IPA
run-name: ${{ inputs.build_id || 'IPA manual' }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "ID enviado por el botón de MARCOMUSIC"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org
        run: rm -f bun.lock && bun install

      - name: Compilar la aplicación web
        run: bunx vite build -c vite.mobile.config.ts && test -f dist-mobile/index.html

      - name: Generar proyecto iOS
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          PL=ios/App/App/Info.plist
          B=/usr/libexec/PlistBuddy
          $B -c "Delete :UIBackgroundModes" $PL 2>/dev/null || true
          $B -c "Add :UIBackgroundModes array" $PL
          $B -c "Add :UIBackgroundModes:0 string audio" $PL
          $B -c "Delete :UIFileSharingEnabled" $PL 2>/dev/null || true
          $B -c "Add :UIFileSharingEnabled bool true" $PL
          $B -c "Delete :LSSupportsOpeningDocumentsInPlace" $PL 2>/dev/null || true
          $B -c "Add :LSSupportsOpeningDocumentsInPlace bool true" $PL
          $B -c "Set :CFBundleDisplayName MARCOMUSIC" $PL || $B -c "Add :CFBundleDisplayName string MARCOMUSIC" $PL

      - name: Generar icono y pantalla de inicio
        run: npx @capacitor/assets generate --ios --iconBackgroundColor '#05060f' --iconBackgroundColorDark '#05060f' --splashBackgroundColor '#05060f' --splashBackgroundColorDark '#05060f'

      - name: Sincronizar Capacitor con iOS
        run: npx cap sync ios

      - name: Compilar app con Xcode
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} build

      - name: Empaquetar IPA
        run: |
          APP=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -d "$APP" || { echo "::error::No se generó la app"; exit 1; }
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry "MARCOMUSIC-1.0.${{ github.run_number }}-unsigned.ipa" Payload
          test -s MARCOMUSIC-*.ipa || { echo "::error::No se generó el IPA"; exit 1; }

      - name: Guardar IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MARCOMUSIC-iOS-1.0.${{ github.run_number }}
          path: MARCOMUSIC-*.ipa

      - name: Publicar IPA para descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-${{ github.run_number }}
          name: MARCOMUSIC iOS 1.0.${{ github.run_number }} (sin firma)
          prerelease: true
          files: MARCOMUSIC-*.ipa
